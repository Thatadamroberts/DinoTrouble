name: Build DinoTrouble

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: DinoTrouble

jobs:
  smoke-test:
    name: Headless smoke test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Import assets
        shell: bash
        run: timeout 300 godot --headless --import --path . || true

      - name: Run smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 600 godot --headless --fixed-fps 60 --path . res://scenes/tests/smoke_test.tscn 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" smoke.log; then
            echo "::error::Script errors found in smoke test output"
            exit 1
          fi

  screenshots:
    name: Render screenshots (GPU, Xvfb)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Install virtual display and Mesa
        shell: bash
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb xauth libgl1-mesa-dri libglx-mesa0 libgl1 \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libxrender1 libxext6 libx11-6 libxkbcommon0 libfontconfig1 >/dev/null

      - name: Import assets
        shell: bash
        run: timeout 300 godot --headless --import --path . || true

      - name: Render
        shell: bash
        run: |
          set -o pipefail
          timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --rendering-driver opengl3 --resolution 1280x720 --path . res://scenes/tests/screenshots.tscn 2>&1 | tee shots.log
          if grep -E "SHADER ERROR|SCRIPT ERROR|Parse Error|Failed to load" shots.log; then
            echo "::error::Errors while rendering"
            exit 1
          fi
          ls -la screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: DinoTrouble-screenshots
          path: screenshots

      # Publish the renders to a throwaway branch so they can be reviewed
      # without downloading artifacts. Only the PNGs live on that branch.
      - name: Publish screenshots branch
        if: github.event_name == 'push'
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/shots && mkdir /tmp/shots && cp screenshots/*.png /tmp/shots/
          cd /tmp/shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

  export:
    name: Export Windows + Web
    needs: [smoke-test, screenshots]
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Install export templates
        shell: bash
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          if [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi

      - name: Import assets
        shell: bash
        run: timeout 300 godot --headless --import --path . || true

      - name: Export Windows
        shell: bash
        run: |
          mkdir -v -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/${EXPORT_NAME}.exe
          ls -la build/windows
          test -f build/windows/${EXPORT_NAME}.exe

      - name: Export Web
        shell: bash
        run: |
          mkdir -v -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web
          test -f build/web/index.html

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DinoTrouble-windows
          path: build/windows

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: DinoTrouble-web
          path: build/web

  deploy-pages:
    name: Deploy web build to GitHub Pages
    needs: export
    # Only publish from pushes to the default branch.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: DinoTrouble-web
          path: web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
