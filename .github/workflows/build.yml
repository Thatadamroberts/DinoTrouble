name: Build DinoTrouble

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: DinoTrouble

jobs:
  smoke-test:
    name: Headless smoke test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Import assets
        shell: bash
        run: timeout 300 godot --headless --import --path . || true

      - name: Run smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 600 godot --headless --fixed-fps 60 --path . res://scenes/tests/smoke_test.tscn 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" smoke.log; then
            echo "::error::Script errors found in smoke test output"
            exit 1
          fi

  export:
    name: Export Windows + Web
    needs: smoke-test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Install export templates
        shell: bash
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          if [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi

      - name: Import assets
        shell: bash
        run: timeout 300 godot --headless --import --path . || true

      - name: Export Windows
        shell: bash
        run: |
          mkdir -v -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/${EXPORT_NAME}.exe
          ls -la build/windows
          test -f build/windows/${EXPORT_NAME}.exe

      - name: Export Web
        shell: bash
        run: |
          mkdir -v -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web
          test -f build/web/index.html

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DinoTrouble-windows
          path: build/windows

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: DinoTrouble-web
          path: build/web
